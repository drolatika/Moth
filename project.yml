name: Moth
options:
  bundleIdPrefix: com.ryanschlecht
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

settings:
  base:
    # Internal identifiers, never shown to users. They must be unique across Apple.
    BUNDLE_ID_PREFIX: com.ryanschlecht
    APP_GROUP_ID: group.com.ryanschlecht.moth
    DEVELOPMENT_TEAM: JH4ZQ9MS78
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Listening services. Leave empty until set up (see README); the app shows "Needs setup".
    SPOTIFY_CLIENT_ID: ""
    LASTFM_API_KEY: ""

targets:
  Moth:
    type: application
    platform: iOS
    sources:
      - Moth
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).moth
        INFOPLIST_FILE: Moth/Info.plist
        CODE_SIGN_ENTITLEMENTS: Moth/Moth.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Outline AppIcon-Ring AppIcon-Illuminated AppIcon-Wordmark"
    dependencies:
      - target: MothShare
        embed: true
    scheme: {}

  MothShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).moth.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/MothShare.entitlements
